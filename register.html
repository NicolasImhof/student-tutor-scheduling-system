<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student-to-Tutor Scheduling System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body>
    <div id="login-view">
        <div class="login-container">
            <h1>Create an Account</h1>
            <p style="text-align: center; color: var(--text-muted-color); margin-bottom: 2rem;">
                Join our platform to start learning or teaching.
            </p>

            <form id="register-form">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="6">
                    <small>Minimum 6 characters required.</small>
                </div>
                <div class="form-group">
                    <label for="role">I want to:</label>
                    <select id="role" name="role" class="form-control" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="Student">Find a Tutor (Student)</option>
                        <option value="Tutor">Become a Tutor</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <div id="registration-message" class="hidden" style="margin-top: 1rem; text-align: center;"></div>

            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <p style="color: var(--text-muted-color); margin-bottom: 1rem;">Already have an account?</p>
                <a href="index.html" class="btn btn-secondary">Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('register-form');
            const messageDiv = document.getElementById('registration-message');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const registerButton = registerForm.querySelector('button[type="submit"]');
                registerButton.disabled = true;
                registerButton.innerHTML = '<span class="spinner"></span> Creating Account...';

                const formData = new FormData(registerForm);
                const email = formData.get('email');

                // Proactive email check
                const { data: existingUser, error: checkError } = await App.supabase.from('users').select('email').eq('email', email).single();
                if (existingUser) {
                    showMessage('An account with this email already exists.', 'error');
                    registerButton.disabled = false;
                    registerButton.innerHTML = 'Create Account';
                    return;
                }

                const userData = {
                    first_name: formData.get('first_name'),
                    last_name: formData.get('last_name'),
                    email: email,
                    password: formData.get('password'), // Plain text password for demo purposes
                    role: formData.get('role'),
                    approval_status: 'Pending' // Default status
                };

                // Basic validation
                if (!userData.first_name || !userData.last_name || !userData.email || !userData.password || !userData.role) {
                    showMessage('Please fill out all fields.', 'error');
                    registerButton.disabled = false;
                    registerButton.innerHTML = 'Create Account';
                    return;
                }

                // The new, simplified flow. The database trigger will handle profile creation.
                try {
                    const { data, error } = await App.supabase.auth.signUp({
                        email: userData.email,
                        password: userData.password,
                        options: {
                            data: { // Pass metadata to the trigger
                                first_name: userData.first_name,
                                last_name: userData.last_name,
                                role: userData.role
                            }
                        }
                    });

                    if (error) {
                        throw error;
                    }

                    registerForm.reset();
                    showMessage('Registration successful! Your account is pending approval. Please check your email to verify your account.', 'success');

                } catch (err) {
                    console.error('An unexpected error occurred:', err);
                    if (err.message && err.message.includes('User already registered')) {
                        showMessage('This email is already registered. Please try logging in or check your email for a verification link.', 'error');
                    } else {
                        showMessage(err.message, 'error');
                    }
                } finally {
                    registerButton.disabled = false;
                    registerButton.innerHTML = 'Create Account';
                }
            });

            function showMessage(message, type) {
                messageDiv.textContent = message;
                messageDiv.className = type; // Use classes for styling (e.g., .success, .error)
                setTimeout(() => { messageDiv.className = 'hidden'; }, 5000);
            }
        });
    </script>
</body>
</html>
