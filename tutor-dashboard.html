<section id="appointments" class="dashboard-section hidden">
    <h2>Upcoming Appointments</h2>
    <div class="appointment-list"></div>
    <div class="pagination-controls">
        <button id="prev-page-btn" class="pagination-btn">← Previous</button>
        <span id="page-info">Page 1 of 1</span>
        <button id="next-page-btn" class="pagination-btn">Next →</button>
    </div>
</section>

<section id="all-appointments" class="dashboard-section hidden">
    <h2>All Appointments</h2>
    <div class="appointment-filters">
        <select id="appointment-status-filter">
            <option value="all">All Status</option>
            <option value="Scheduled">Scheduled</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Pending">Pending</option>
        </select>
        <input type="date" id="appointment-date-filter" placeholder="Filter by date">
    </div>
    <div class="all-appointments-list"></div>
    <div class="pagination-controls">
        <button id="all-prev-page-btn" class="pagination-btn">← Previous</button>
        <span id="all-page-info">Page 1 of 1</span>
        <button id="all-next-page-btn" class="pagination-btn">Next →</button>
    </div>
</section>
<section id="my-profile" class="dashboard-section hidden">
    <h2>My Profile</h2>
    <form class="profile-form">
        <label for="tutor-name">Name:</label>
        <input type="text" id="tutor-name" value="Jane Smith">
        <label for="tutor-email">Email:</label>
        <input type="email" id="tutor-email" value="tutor@example.com" readonly>
        <button type="submit">Update Profile</button>
    </form>
</section>
<section id="working-hours" class="dashboard-section hidden">
    <h2>Weekly Working Hours</h2>
    <div class="working-hours-container">
        <div class="current-schedule">
            <h3>Current Schedule</h3>
            <div class="schedule-grid" id="current-schedule-grid"></div>
        </div>
        <div class="schedule-editor">
            <h3>Edit Schedule</h3>
            <form id="working-hours-form">
                <div class="day-schedule" data-day="Monday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working" checked> Monday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="09:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="17:00">
                    </div>
                </div>
                <div class="day-schedule" data-day="Tuesday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working" checked> Tuesday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="09:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="17:00">
                    </div>
                </div>
                <div class="day-schedule" data-day="Wednesday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working" checked> Wednesday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="09:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="17:00">
                    </div>
                </div>
                <div class="day-schedule" data-day="Thursday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working" checked> Thursday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="09:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="17:00">
                    </div>
                </div>
                <div class="day-schedule" data-day="Friday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working" checked> Friday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="09:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="17:00">
                    </div>
                </div>
                <div class="day-schedule" data-day="Saturday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working" checked> Saturday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="10:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="14:00">
                    </div>
                </div>
                <div class="day-schedule" data-day="Sunday">
                    <label class="day-checkbox">
                        <input type="checkbox" class="day-working"> Sunday
                    </label>
                    <div class="time-inputs">
                        <input type="time" class="start-time" value="09:00">
                        <span>to</span>
                        <input type="time" class="end-time" value="17:00">
                    </div>
                </div>
                <button type="submit" class="save-schedule-btn">Save Schedule</button>
            </form>
        </div>
    </div>
</section>

<section id="calendar" class="dashboard-section hidden">
    <h2>Calendar</h2>
    <div class="calendar-container"></div>
</section>
