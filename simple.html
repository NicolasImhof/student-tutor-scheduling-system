<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-to-Tutor Scheduling System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="login-view">
        <div class="login-container">
            <h1>Student-to-Tutor Scheduling</h1>
            <p style="text-align: center; color: var(--text-muted-color); margin-bottom: 2rem;">
                Connect with qualified tutors and manage your learning schedule
            </p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div id="demo-credentials"></div>
            <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                <p style="color: var(--text-muted-color); margin-bottom: 1rem;">New to our platform?</p>
                <a href="preview.html" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        <header>
            <h1>Student-to-Tutor Scheduling</h1>
            <nav id="main-nav">
                <a href="#" id="logout-link">Logout</a>
            </nav>
        </header>

        <div id="dashboard-nav-container">
            <h2 id="dashboard-title">Dashboard</h2>
            <nav id="dashboard-nav"></nav>
        </div>

        <main>
            <div id="dashboard-content"></div>
        </main>

        <footer>
            <p>&copy; 2026 Student-to-Tutor Scheduling</p>
        </footer>
    </div>

    <div id="modal-container"></div>

    <script>
        // Simple test version
        window.App = {
            supabase: null,
            currentUser: null,

            init() {
                const supabaseUrl = 'https://bycjjodkedhynxkckwtg.supabase.co';
                const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5Y2pqb2RrZWRoeW54a2Nrd3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTYzODAsImV4cCI6MjA4NjA3MjM4MH0.mrCDflIMgQvJ0fIEaRJao_pdzLgafgsrlUSDQRCiPqc';
                this.supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
                this.addEventListeners();
                this.showLoginView();
            },

            addEventListeners() {
                document.getElementById('login-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = e.target.email.value;
                    const password = e.target.password.value;
                    this.login(email, password);
                });

                document.getElementById('logout-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.logout();
                });
            },

            async login(email, password) {
                console.log('Attempting login with email:', email);
                const { data, error } = await this.supabase.from('users').select('*').eq('email', email).single();

                if (error && error.code !== 'PGRST116') {
                    console.error('Login error:', error);
                    alert('Login error: ' + error.message);
                    return;
                }

                if (data && data.password === password) {
                    console.log('Login successful');
                    this.currentUser = data;
                    this.showDashboardView();
                } else {
                    console.log('Login failed');
                    alert('Invalid email or password');
                }
            },

            logout() {
                this.currentUser = null;
                this.showLoginView();
            },

            async showLoginView() {
                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                await this.fetchAndDisplayDemoCredentials();
            },

            showDashboardView() {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-title').textContent = this.currentUser.first_name + ' Dashboard';
                this.loadDashboardNav();
                
                const defaultView = {
                    'Student': 'find-tutor',
                    'Tutor': 'my-availability',
                    'Admin': 'admin-dashboard'
                }[this.currentUser.role];
                
                this.loadDashboardView(defaultView);
            },

            async fetchAndDisplayDemoCredentials() {
                const roles = ['Student', 'Tutor', 'Admin'];
                let demoHtml = '<h4>Demo Credentials</h4>';
                for (const role of roles) {
                    try {
                        const { data, error } = await this.supabase.from('users').select('email, password').eq('role', role).limit(1).single();
                        if (data) {
                            demoHtml += '<p><strong>' + role + ':</strong><br>Email: ' + data.email + '<br>Password: ' + data.password + '</p>';
                        }
                    } catch (error) {
                        console.error('Could not load demo user for role:', role, error);
                    }
                }
                document.getElementById('demo-credentials').innerHTML = demoHtml;
            },

            loadDashboardNav() {
                const nav = document.getElementById('dashboard-nav');
                if (!nav) return;
                
                let navLinks = '<a href="#my-profile" class="nav-link">My Profile</a>';
                if (this.currentUser.role === 'Admin') navLinks += '<a href="#admin-dashboard" class="nav-link">Admin Dashboard</a>';
                if (this.currentUser.role === 'Tutor') navLinks += '<a href="#my-availability" class="nav-link">My Availability</a>';
                if (this.currentUser.role === 'Student') navLinks += '<a href="#find-tutor" class="nav-link">Find a Tutor</a>';
                navLinks += '<a href="#my-appointments" class="nav-link">My Appointments</a>';
                nav.innerHTML = navLinks;

                // Add navigation event listeners
                nav.addEventListener('click', (e) => {
                    if (e.target.matches('a.nav-link')) {
                        e.preventDefault();
                        const view = e.target.getAttribute('href').substring(1);
                        this.loadDashboardView(view);
                    }
                });
            },

            loadDashboardView(view) {
                const dashboardContent = document.getElementById('dashboard-content');
                if (!dashboardContent) return;

                // Update active nav link
                document.querySelectorAll('#dashboard-nav .nav-link').forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + view) link.classList.add('active');
                });

                switch (view) {
                    case 'admin-dashboard':
                        this.loadAdminDashboard();
                        break;
                    case 'find-tutor':
                        this.loadFindTutorView();
                        break;
                    case 'my-appointments':
                        this.loadMyAppointmentsView();
                        break;
                    case 'my-availability':
                        this.loadMyAvailabilityView();
                        break;
                    case 'my-profile':
                        this.loadMyProfileView();
                        break;
                    default:
                        dashboardContent.innerHTML = '<h2>Under Construction</h2>';
                        break;
                }
            },

            loadMyProfileView() {
                const content = '<h2>My Profile</h2><div class="profile-card"><p><strong>Name:</strong> ' + 
                    this.currentUser.first_name + ' ' + this.currentUser.last_name + '</p><p><strong>Email:</strong> ' + 
                    this.currentUser.email + '</p><p><strong>Role:</strong> ' + this.currentUser.role + '</p></div>';
                document.getElementById('dashboard-content').innerHTML = content;
            },

            loadMyAvailabilityView() {
                document.getElementById('dashboard-content').innerHTML = '<h2>My Availability</h2><p>Availability management coming soon...</p>';
            },

            async loadMyAppointmentsView() {
                try {
                    let query = this.supabase.from('appointments_enhanced').select('*');
                    if (this.currentUser.role === 'Student') query = query.eq('student_id', this.currentUser.user_id);
                    else if (this.currentUser.role === 'Tutor') query = query.eq('tutor_id', this.currentUser.user_id);
                    
                    const { data, error } = await query.order('start_time', { ascending: false });
                    
                    if (error) {
                        document.getElementById('dashboard-content').innerHTML = '<p class="error">Failed to load appointments.</p>';
                        return;
                    }
                    
                    let appointmentsHTML = '<h2>My Appointments</h2>';
                    if (data.length === 0) {
                        appointmentsHTML += '<p>No appointments found.</p>';
                    } else {
                        appointmentsHTML += '<div class="table-responsive"><table class="user-table"><thead><tr><th>Date & Time</th><th>Status</th></tr></thead><tbody>';
                        data.forEach(appt => {
                            appointmentsHTML += '<tr><td>' + new Date(appt.start_time).toLocaleString() + '</td><td>' + appt.status + '</td></tr>';
                        });
                        appointmentsHTML += '</tbody></table></div>';
                    }
                    document.getElementById('dashboard-content').innerHTML = appointmentsHTML;
                } catch (error) {
                    console.error('Error loading appointments:', error);
                    document.getElementById('dashboard-content').innerHTML = '<p class="error">Failed to load appointments.</p>';
                }
            },

            async loadFindTutorView() {
                try {
                    const { data, error } = await this.supabase.from('users').select('*').eq('role', 'Tutor');
                    if (error) {
                        document.getElementById('dashboard-content').innerHTML = '<p class="error">Failed to load tutors.</p>';
                        return;
                    }
                    
                    let tutorsHTML = '<h2>Find a Tutor</h2>';
                    if (data.length === 0) {
                        tutorsHTML += '<p>No tutors available.</p>';
                    } else {
                        tutorsHTML += '<div class="tutor-grid">';
                        data.forEach(tutor => {
                            tutorsHTML += '<div class="tutor-card"><h4>' + tutor.first_name + ' ' + tutor.last_name + '</h4>' +
                                '<p>' + tutor.email + '</p><button class="btn btn-primary book-now-btn" data-tutor-id="' + 
                                tutor.user_id + '">Book Now</button></div>';
                        });
                        tutorsHTML += '</div>';
                    }
                    document.getElementById('dashboard-content').innerHTML = tutorsHTML;
                } catch (error) {
                    console.error('Error loading tutors:', error);
                    document.getElementById('dashboard-content').innerHTML = '<p class="error">Failed to load tutors.</p>';
                }
            },

            async loadAdminDashboard() {
                try {
                    const { data: users, error: usersError } = await this.supabase.from('users').select('*');
                    const { data: appointments, error: appointmentsError } = await this.supabase.from('appointments_enhanced').select('*');
                    
                    if (usersError || appointmentsError) {
                        document.getElementById('dashboard-content').innerHTML = '<p class="error">Failed to load dashboard data.</p>';
                        return;
                    }
                    
                    let usersHTML = '<h2>Admin Dashboard</h2><div class="metrics-grid">' +
                        '<div class="metric-card"><h3>Total Users</h3><p class="metric-value">' + users.length + '</p></div>' +
                        '<div class="metric-card"><h3>Total Appointments</h3><p class="metric-value">' + appointments.length + '</p></div></div>' +
                        '<h3>User Management</h3><div class="table-responsive"><table class="user-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>';
                    
                    users.forEach(user => {
                        usersHTML += '<tr><td>' + user.first_name + ' ' + user.last_name + '</td><td>' + 
                            user.email + '</td><td>' + user.role + '</td></tr>';
                    });
                    usersHTML += '</tbody></table></div>';
                    
                    document.getElementById('dashboard-content').innerHTML = usersHTML;
                } catch (error) {
                    console.error('Error loading admin dashboard:', error);
                    document.getElementById('dashboard-content').innerHTML = '<p class="error">Failed to load dashboard data.</p>';
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => window.App.init());
    </script>
</body>
</html>
