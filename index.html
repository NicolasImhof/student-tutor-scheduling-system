<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-to-Tutor Scheduling System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="calendar.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- =====================================================================================
       LOGIN VIEW
       - This is the default view shown to logged-out users.
       ===================================================================================== -->
    <div id="login-view">
        <div class="login-container">
            <h1>Student-to-Tutor Scheduling</h1>
            <p style="text-align: center; color: var(--text-muted-color); margin-bottom: 2rem;">
                Connect with qualified tutors and manage your learning schedule
            </p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <p style="color: var(--text-muted-color); margin-bottom: 1rem;">Don't have an account?</p>
                <a href="register.html" class="btn btn-secondary">Create Account</a>
            </div>
        </div>
    </div>

    <!-- The dashboard will be dynamically rendered here by script.js -->
    <div id="dashboard-container"></div>

    <!-- =====================================================================================
       MODAL CONTAINER
       ===================================================================================== -->
    <div id="modal-container"></div>

    <script src="script.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
