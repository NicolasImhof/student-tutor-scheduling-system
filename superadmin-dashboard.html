<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Super Admin Dashboard</h1>
            <nav>
                <a href="#" class="nav-link">Manage All Users</a>
                <a href="#" class="nav-link">System-Wide Schedule</a>
            </nav>
        </header>
        <div class="dashboard-main">
            <div class="dashboard-content-area">
                <section id="manage-all-users" class="dashboard-section">
                    <h2>Manage All Users</h2>
                    <!-- User management UI will go here -->
                </section>
                <section id="system-wide-schedule" class="dashboard-section hidden">
                    <h2>System-Wide Schedule</h2>
                    <p>Click a date on the calendar to mark it as a holiday.</p>
                </section>
            </div>
            <div class="calendar-container">
                <!-- Calendar will be dynamically generated here -->
            </div>
        </div>
    </div>
</body>
</html>
