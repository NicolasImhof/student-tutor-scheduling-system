<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .dashboard-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .hidden { display: none; }
        .nav-link { display: inline-block; margin: 5px; padding: 8px 12px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .nav-link:hover { background: #0056b3; }
        .success { color: green; }
        .error { color: red; }
        .user-card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; background: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Admin Dashboard Test</h1>
    
    <div id="dashboard-nav">
        <a href="#" class="nav-link" data-target="manage-users" onclick="testNavigation('Manage Users')">Manage Users</a>
        <a href="#" class="nav-link" data-target="manage-tutors" onclick="testNavigation('Manage Tutors')">Manage Tutors</a>
        <a href="#" class="nav-link" data-target="schedule-rules" onclick="testNavigation('Schedule Rules')">Schedule Rules</a>
    </div>
    
    <div id="dashboard-content">
        <section id="manage-users" class="dashboard-section hidden">
            <h2>Manage Users</h2>
            <div id="user-management-content">
                <p>Loading users...</p>
            </div>
        </section>
        
        <section id="manage-tutors" class="dashboard-section hidden">
            <h2>Manage Tutors</h2>
            <p>Tutor management content would go here</p>
        </section>
        
        <section id="schedule-rules" class="dashboard-section hidden">
            <h2>Schedule Rules</h2>
            <p>Schedule rules content would go here</p>
        </section>
    </div>
    
    <div id="test-results"></div>

    <script>
        // Mock session storage
        sessionStorage.setItem('authToken', 'test-token');
        
        async function testNavigation(section) {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = `<p>Testing navigation to: ${section}</p>`;
            
            // Hide all sections
            document.querySelectorAll('.dashboard-section').forEach(sec => {
                sec.classList.add('hidden');
            });
            
            // Show the selected section
            let targetSection;
            switch(section) {
                case 'Manage Users':
                    targetSection = document.getElementById('manage-users');
                    break;
                case 'Manage Tutors':
                    targetSection = document.getElementById('manage-tutors');
                    break;
                case 'Schedule Rules':
                    targetSection = document.getElementById('schedule-rules');
                    break;
            }
            
            if (targetSection) {
                targetSection.classList.remove('hidden');
                resultsDiv.innerHTML += `<p class="success">Section "${section}" is now visible</p>`;
                
                // Test user loading if it's the users section
                if (section === 'Manage Users') {
                    await testUserLoading();
                }
            } else {
                resultsDiv.innerHTML += `<p class="error">Section "${section}" not found</p>`;
            }
        }
        
        async function testUserLoading() {
            const contentDiv = document.getElementById('user-management-content');
            try {
                console.log('Testing user loading...');
                const response = await fetch('/api/admin/users', {
                    headers: {
                        'Authorization': 'Bearer test-token'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const users = await response.json();
                console.log('Users loaded:', users);
                
                let html = '<div class="user-filters"><select id="user-role-filter"><option value="all">All Roles</option><option value="Student">Students</option><option value="Tutor">Tutors</option><option value="Admin">Admins</option></select></div>';
                html += '<div class="user-grid">';
                
                users.forEach(user => {
                    html += `
                        <div class="user-card">
                            <h4>${user.name}</h4>
                            <p>Email: ${user.email}</p>
                            <p>Role: ${user.role}</p>
                            <p>Status: ${user.approval_status}</p>
                            <div class="user-actions">
                                <button onclick="alert('Edit ${user.email}')">Edit</button>
                                <button onclick="alert('Toggle status for ${user.email}')">Toggle Status</button>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                contentDiv.innerHTML = html;
                
                document.getElementById('test-results').innerHTML += '<p class="success">User loading test successful!</p>';
            } catch (error) {
                console.error('Error loading users:', error);
                contentDiv.innerHTML = `<p class="error">Error loading users: ${error.message}</p>`;
                document.getElementById('test-results').innerHTML += `<p class="error">User loading test failed: ${error.message}</p>`;
            }
        }
        
        // Test on page load
        window.onload = function() {
            console.log('Admin dashboard test loaded');
            document.getElementById('test-results').innerHTML = '<p>Test page loaded. Click navigation links to test.</p>';
        };
    </script>
</body>
</html>
