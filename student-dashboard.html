<section id="find-tutor" class="dashboard-section">
    <h2>Find a Tutor</h2>
    <form class="search-form">
        <input type="text" placeholder="Search by course, tutor, or capability...">
        <button type="submit">Search</button>
    </form>
    <div class="tutor-list">
        <div class="tutor-card">
            <h3>John Smith (Tutor)</h3>
            <p><strong>Courses:</strong> Calculus I, Physics I</p>
            <p><strong>Rating:</strong> 4.8/5</p>
        </div>
    </div>
</section>
<section id="my-appointments" class="dashboard-section hidden">
    <h2>My Appointments</h2>
    <div class="appointment-list"></div>
</section>
<section id="my-profile" class="dashboard-section hidden">
    <h2>My Profile</h2>
    <form class="profile-form">
        <label for="student-name">Name:</label>
        <input type="text" id="student-name" value="John Doe">
        <label for="student-email">Email:</label>
        <input type="email" id="student-email" value="student@example.com" readonly>
        <button type="submit">Update Profile</button>
    </form>
</section>
<section id="calendar" class="dashboard-section hidden">
    <h2>Calendar</h2>
    <div class="calendar-container"></div>
</section>
