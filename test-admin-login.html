<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .login-form { max-width: 300px; margin: 20px 0; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Admin Login & Dashboard Test</h1>
    
    <div class="test-section">
        <h2>Test Admin Login</h2>
        <div class="login-form">
            <input type="email" id="email" placeholder="admin@example.com" value="admin@example.com">
            <input type="password" id="password" placeholder="password123" value="password123">
            <button onclick="testLogin()">Login as Admin</button>
        </div>
        <div id="login-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Direct Dashboard Access</h2>
        <button onclick="testDirectAccess()">Access Admin Dashboard Directly</button>
        <div id="dashboard-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test User Management API</h2>
        <button onclick="testUserApi()">Test User Management API</button>
        <div id="api-result"></div>
    </div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                console.log('Testing login with:', email, password);
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (!response.ok) {
                    throw new Error(`Login failed: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Login response:', data);
                
                sessionStorage.setItem('authToken', data.token);
                sessionStorage.setItem('userRole', data.role);
                sessionStorage.setItem('userEmail', data.email);
                
                resultDiv.innerHTML = `<p class="success">Login successful! Token: ${data.token}</p>`;
                
                // Test accessing admin dashboard
                setTimeout(() => testAdminDashboard(), 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `<p class="error">Login failed: ${error.message}</p>`;
            }
        }
        
        async function testDirectAccess() {
            const resultDiv = document.getElementById('dashboard-result');
            
            // Set mock admin session
            sessionStorage.setItem('authToken', 'test-admin-token');
            sessionStorage.setItem('userRole', 'Admin');
            sessionStorage.setItem('userEmail', 'admin@example.com');
            
            try {
                const response = await fetch('admin-dashboard.html');
                if (!response.ok) {
                    throw new Error(`Dashboard load failed: ${response.status}`);
                }
                
                const html = await response.text();
                resultDiv.innerHTML = `<p class="success">Admin dashboard HTML loaded successfully</p>`;
                resultDiv.innerHTML += `<textarea style="width:100%;height:200px;">${html.substring(0, 500)}...</textarea>`;
                
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Dashboard access failed: ${error.message}</p>`;
            }
        }
        
        async function testUserApi() {
            const resultDiv = document.getElementById('api-result');
            
            // Ensure we have a token
            if (!sessionStorage.getItem('authToken')) {
                sessionStorage.setItem('authToken', 'test-token');
            }
            
            try {
                console.log('Testing user management API...');
                const response = await fetch('/api/admin/users', {
                    headers: {
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status} ${response.statusText}`);
                }
                
                const users = await response.json();
                console.log('Users retrieved:', users);
                
                resultDiv.innerHTML = `<p class="success">API test successful! Found ${users.length} users</p>`;
                resultDiv.innerHTML += '<pre>' + JSON.stringify(users, null, 2) + '</pre>';
                
            } catch (error) {
                console.error('API error:', error);
                resultDiv.innerHTML = `<p class="error">API test failed: ${error.message}</p>`;
            }
        }
        
        async function testAdminDashboard() {
            const resultDiv = document.getElementById('dashboard-result');
            try {
                const response = await fetch('admin-dashboard.html');
                const html = await response.text();
                console.log('Admin dashboard loaded');
                resultDiv.innerHTML = `<p class="success">Admin dashboard accessed successfully</p>`;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Failed to access admin dashboard: ${error.message}</p>`;
            }
        }
        
        // Auto-test API on page load
        window.onload = function() {
            console.log('Test page loaded');
            testUserApi();
        };
    </script>
</body>
</html>
