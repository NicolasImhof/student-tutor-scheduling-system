<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-view">
    <header>
        <h1>Student-to-Tutor Scheduling</h1>
        <nav id="main-nav">
            <a href="index.html">Home</a>
            <a href="#" id="logout-link">Logout</a>
        </nav>
    </header>
    <div id="dashboard-nav-container">
        <h2 id="dashboard-title">Tutor Dashboard</h2>
        <nav id="dashboard-nav">
            <a href="#my-availability" class="nav-link active">My Availability</a>
            <a href="#appointments" class="nav-link">Appointments</a>
            <a href="#my-profile" class="nav-link">My Profile</a>
            <a href="#calendar" class="nav-link">Calendar</a>
        </nav>
        <a href="#" id="dashboard-logout-link">Logout</a>
    </div>
    <main>
        <div id="dashboard-content">
            <section id="my-availability" class="dashboard-section">
                <h2>My Availability</h2>
                <p>Click a date on the calendar to set your available time slots.</p>
            </section>
            <section id="appointments" class="dashboard-section hidden">
                <h2>Appointments</h2>
                <div class="appointment-list"></div>
            </section>
            <section id="my-profile" class="dashboard-section hidden">
                <h2>My Profile</h2>
                <form class="profile-form">
                    <label for="tutor-name">Name:</label>
                    <input type="text" id="tutor-name" value="Jane Smith">
                    <label for="tutor-email">Email:</label>
                    <input type="email" id="tutor-email" value="tutor@example.com" readonly>
                    <button type="submit">Update Profile</button>
                </form>
            </section>
            <section id="calendar" class="dashboard-section hidden">
                <h2>Calendar</h2>
                <div class="calendar-container"></div>
            </section>
        </div>
    </main>
</body>
</html>
